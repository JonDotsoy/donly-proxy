<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>donly-proxy · logs</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; }
  header { position: sticky; top: 0; display: flex; gap: 1rem; align-items: center; padding: .5rem 1rem; background: Canvas; border-bottom: 1px solid #8884; }
  header h1 { font-size: 1rem; margin: 0; flex: 1; }
  #status { font-size: .8rem; }
  table { width: 100%; border-collapse: collapse; font: .8rem ui-monospace, monospace; }
  td { padding: .2rem .6rem; border-bottom: 1px solid #8882; vertical-align: top; white-space: pre-wrap; word-break: break-all; }
  td.type { font-weight: 600; }
  .request .type { color: #0a7; } .response .type { color: #37f; } .listening .type { color: #a70; }
  .request_proxy_pass .type, .response_proxy_pass .type { color: #09c; } .command_start .type, .command_end .type, .script_start .type, .script_exit .type { color: #a3a; } .request_annotation .type, .annotation .type { color: #888; }
  .bad .status { color: #d33; }
  tr:hover { background: #8881; cursor: pointer; }
  pre { margin: 0; }
</style>
</head>
<body>
<header>
  <h1>donly-proxy · logs</h1>
  <label><input id="follow" type="checkbox" checked> seguir</label>
  <button id="clear">Limpiar</button>
  <span id="status">conectando…</span>
</header>
<table><tbody id="rows"></tbody></table>
<script>
  const rows = document.getElementById("rows");
  const status = document.getElementById("status");
  const follow = document.getElementById("follow");
  document.getElementById("clear").onclick = () => (rows.textContent = "");

  const cell = (text, className) => {
    const td = document.createElement("td");
    td.textContent = text;
    if (className) td.className = className;
    return td;
  };

  const parents = new Map(); // span_id -> depth
  const add = (line) => {
    let entry;
    try { entry = JSON.parse(line); } catch { entry = { type: "raw", raw: line }; }
    const tr = document.createElement("tr");
    // Nested transactions (a process, a proxy_pass) are indented under the request that opened them.
    const depth = !entry.parent_span_id ? 0 : (parents.get(entry.parent_span_id) ?? 0) + 1;
    if (entry.span_id) parents.set(entry.span_id, depth);
    const code = entry.status ?? entry.statusCode;
    tr.className = `${entry.type} ${code >= 400 ? "bad" : ""}`;
    const what = entry.type === "listening" ? `${entry.host}:${entry.port}`
      : entry.type === "command_start" ? [entry.program, ...(entry.args ?? [])].join(" ")
      : entry.type === "command_end" || entry.type === "script_exit" ? `${entry.program} exit ${entry.exit_code}`
      : entry.type === "request_proxy_pass" || entry.type === "response_proxy_pass" ? `${entry.method} ${entry.target}`
      : [entry.method, entry.url ?? entry.raw].filter(Boolean).join(" ");
    tr.append(
      cell(entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString() : ""),
      cell(entry.type ?? "", "type"),
      cell(code ?? "", "status"),
      cell(what),
    );
    tr.lastElementChild.style.paddingLeft = `${0.6 + depth * 1.2}rem`;
    const detail = document.createElement("pre");
    detail.hidden = true;
    detail.textContent = JSON.stringify(entry, null, 2);
    const full = document.createElement("td");
    full.colSpan = 4;
    full.hidden = true;
    full.append(detail);
    const extra = document.createElement("tr");
    extra.append(full);
    tr.onclick = () => { full.hidden = detail.hidden = !detail.hidden; };
    rows.append(tr, extra);
    if (follow.checked) tr.scrollIntoView({ block: "end" });
  };

  const source = new EventSource("/events");
  source.onopen = () => {
    rows.textContent = ""; parents.clear(); // the server replays the history on every (re)connection
    status.textContent = "en vivo";
  };
  source.onerror = () => (status.textContent = "reconectando…");
  source.onmessage = (event) => add(event.data);
</script>
</body>
</html>
