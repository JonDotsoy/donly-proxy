name: ssh-pass-test

# Temporary check: run the proxy with ssh_pass (subdirectives) against the test droplet.
# Only runs on pull requests from this exact branch. Removed before merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  ssh-pass:
    if: github.head_ref == 'claude/project-thread-ouqt66' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Write key and manifest
        env:
          SSH_TEST_KEY: ${{ secrets.SSH_TEST_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$SSH_TEST_KEY" > "$RUNNER_TEMP/keys/id_ed25519"
          cat > "$RUNNER_TEMP/manifest.donly" <<MANIFEST
          proxy {
            listen 127.0.0.1 18080
            log_file "./proxy.ndjson"
            route {
              ssh_pass {
                host "161.35.11.114"
                port 45322
                user "root"
                identity_file "./keys/id_ed25519"
                option "StrictHostKeyChecking=accept-new"
                option "IdentitiesOnly=yes"
                command_pass curl "--max-time" "10"
              }
            }
          }
          MANIFEST

      - name: Start proxy
        run: |
          bun src/cli/main.ts "$RUNNER_TEMP/manifest.donly" > "$RUNNER_TEMP/proxy.out" 2>&1 &
          for i in $(seq 1 20); do nc -z 127.0.0.1 18080 && break; sleep 0.5; done
          cat "$RUNNER_TEMP/proxy.out"

      - name: Request through ssh_pass
        run: |
          echo "runner ip: $(curl -fsS https://api.ipify.org)"
          echo "egress via droplet:"
          curl -sS -m 30 -x http://127.0.0.1:18080 http://api.ipify.org -w '\nHTTP %{http_code}\n'

      - name: Proxy log
        if: always()
        run: |
          cat "$RUNNER_TEMP/proxy.out" || true
          grep -o '"type":"command_start".*"args":\[[^]]*\]' "$RUNNER_TEMP/proxy.ndjson" | cut -c1-400 || true
          rm -f "$RUNNER_TEMP/keys/id_ed25519"
